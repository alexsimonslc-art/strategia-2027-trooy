    <meta
      name="description"
      content="Join STRATEGIA 2026, The Ultimate Business Strategy Challenge presented by the Department of B.Com (Honours) Loyola College, Chennai. Showcase your talent, compete with sharp minds, and register online!"

  <body data-page="panel-registration-form" data-route="/panel-discussion/register">
    <div id="root">
      <div data-component="toaster"></div>

      <!-- ============================================================
         DESKTOP LAYOUT (shown on laptops / desktops)
         ============================================================ -->
      <div class="view-desktop min-h-screen flex flex-col">
        <div data-component="cursor-trail"></div>
        <div data-component="navigation"></div>
        <main class="flex-1">
          <div class="min-h-screen w-full flex items-center justify-center bg-gray-50">
            <div class="rounded-lg border bg-card text-card-foreground shadow-sm w-full max-w-md mx-4">
              <div class="p-6 pt-6">
                <div class="flex mb-4 gap-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-circle-alert h-8 w-8 text-red-500"
                  >
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" x2="12" y1="8" y2="12"></line>
                    <line x1="12" x2="12.01" y1="16" y2="16"></line>
                  </svg>
                  <h1 class="text-2xl font-bold text-gray-900">404 Page Not Found</h1>
                </div>
                <p class="mt-4 text-sm text-gray-600">Did you forget to add the page to the router?</p>
              </div>
            </div>
          </div>
        </main>
        <div data-component="footer"></div>
      </div>

      <!-- ============================================================
         MOBILE LAYOUT (shown on phones / tablets)
         ============================================================ -->
      <div class="view-mobile min-h-screen bg-white">
        <div data-component="mobile-navigation"></div>
        <div class="pb-20">
          <div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-4">
            <div
              class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden"
              style="opacity: 0; transform: translateY(20px)"
              data-motion='{"initial":{"opacity":0,"y":20},"animate":{"opacity":1,"y":0}}'
            >
              <form class="p-6 space-y-6">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-user inline w-4 h-4 mr-1"
                    >
                      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle></svg
                    >Salutation *</label
                  ><select
                    name="salutation"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select</option>
                    <option value="Mr.">Mr.</option>
                    <option value="Ms.">Ms.</option>
                    <option value="Mrs.">Mrs.</option>
                    <option value="Dr.">Dr.</option>
                    <option value="Prof.">Prof.</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label
                  ><input
                    type="text"
                    name="name"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your full name"
                    value=""
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Gender *</label
                  ><select
                    name="gender"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Others">Others</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Age *</label
                  ><input
                    type="number"
                    name="age"
                    required=""
                    min="15"
                    max="100"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your age"
                    value=""
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-building2 inline w-4 h-4 mr-1"
                    >
                      <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                      <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                      <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                      <path d="M10 6h4"></path>
                      <path d="M10 10h4"></path>
                      <path d="M10 14h4"></path>
                      <path d="M10 18h4"></path></svg
                    >Institution / Organization Name *</label
                  ><input
                    type="text"
                    name="institution"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Your institution"
                    value=""
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-briefcase inline w-4 h-4 mr-1"
                    >
                      <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                      <rect width="20" height="14" x="2" y="6" rx="2"></rect></svg
                    >Profession *</label
                  ><select
                    name="profession"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select profession</option>
                    <option value="Student">Student</option>
                    <option value="Professor">Professor</option>
                    <option value="Entrepreneur">Entrepreneur</option>
                    <option value="Salaried Employee">Salaried Employee</option>
                    <option value="Business Professional">Business Professional</option>
                    <option value="Corporate Executive">Corporate Executive</option>
                    <option value="Consultant">Consultant</option>
                    <option value="Researcher">Researcher</option>
                    <option value="Others">Others</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-graduation-cap inline w-4 h-4 mr-1"
                    >
                      <path
                        d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
                      ></path>
                      <path d="M22 10v6"></path>
                      <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg
                    >Qualification *</label
                  ><select
                    name="qualification"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">Select qualification</option>
                    <option value="UG (Undergraduate)">UG (Undergraduate)</option>
                    <option value="PG (Postgraduate)">PG (Postgraduate)</option>
                    <option value="PhD">PhD</option>
                    <option value="Others">Others</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-mail inline w-4 h-4 mr-1"
                    >
                      <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg
                    >Email Address *</label
                  ><input
                    type="email"
                    name="email"
                    required=""
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="your.email@example.com"
                    value=""
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-phone inline w-4 h-4 mr-1"
                    >
                      <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                      ></path></svg
                    >Phone Number *</label
                  ><input
                    type="tel"
                    name="phone"
                    required=""
                    minlength="10"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="1234567890"
                    value=""
                  />
                </div>
                <button
                  type="button"
                  disabled=""
                  class="w-full bg-strategia-red text-white py-3 px-6 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 flex items-center justify-center"
                >
                  Registration Closed
                </button>
                <p class="text-xs text-gray-500 text-center mt-4">
                  By registering, you agree to receive event updates via email
                </p>
              </form>
              <div class="bg-blue-50 border-t border-blue-100 p-4">
                <h3 class="font-semibold text-blue-900 mb-2 text-sm">Important Information</h3>
                <ul class="text-xs text-blue-800 space-y-1">
                  <li>• Registration is completely free</li>
                  <li>• Seats are limited - first-come, first-served</li>
                  <li>• Confirmation email within 24 hours</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/lib/motion.js"></script>
    <script src="/lib/states.js"></script>
    <script src="/lib/forms.js"></script>
    <script src="/pages/panel-registration-form.js"></script>
  </body>
